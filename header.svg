<svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="180" fill="#0d1117"/>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="800" height="2" fill="#4A9EFF" opacity="0.15">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,180" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Top border line animated draw -->
  <line x1="40" y1="20" x2="760" y2="20" stroke="#4A9EFF" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" from="0" to="0.5" dur="0.4s" begin="0.2s" fill="freeze"/>
  </line>

  <!-- Corner TL -->
  <text x="30" y="24" fill="#4A9EFF" font-family="monospace" font-size="13" opacity="0">╔
    <animate attributeName="opacity" from="0" to="0.8" dur="0.2s" begin="0.1s" fill="freeze"/>
  </text>
  <!-- Corner TR -->
  <text x="752" y="24" fill="#4A9EFF" font-family="monospace" font-size="13" opacity="0">╗
    <animate attributeName="opacity" from="0" to="0.8" dur="0.2s" begin="0.1s" fill="freeze"/>
  </text>

  <!-- MUHAMMAD — fades in letter by letter via staggered groups -->
  <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#4A9EFF" letter-spacing="5" text-anchor="middle">
    <text x="400" y="52" opacity="0">MUHAMMAD
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.3s" fill="freeze"/>
    </text>
  </g>

  <!-- MUHAMMAD underline -->
  <line x1="280" y1="58" x2="520" y2="58" stroke="#4A9EFF" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" from="0" to="0.4" dur="0.3s" begin="0.7s" fill="freeze"/>
    <animate attributeName="x2" from="280" to="520" dur="0.5s" begin="0.3s" fill="freeze"/>
  </line>

  <!-- USMAN — large, bold, dramatic reveal with clip -->
  <clipPath id="nameClip">
    <rect x="0" y="60" width="0" height="90">
      <animate attributeName="width" from="0" to="800" dur="0.8s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>
  </clipPath>

  <text x="400" y="132"
    text-anchor="middle"
    fill="#E6EDF3"
    font-family="'Courier New', Courier, monospace"
    font-size="72"
    font-weight="700"
    letter-spacing="18"
    clip-path="url(#nameClip)">USMAN</text>

  <!-- Glitch duplicate — slight offset, blue tint, flickers -->
  <text x="402" y="132"
    text-anchor="middle"
    fill="#4A9EFF"
    font-family="'Courier New', Courier, monospace"
    font-size="72"
    font-weight="700"
    letter-spacing="18"
    opacity="0"
    clip-path="url(#nameClip)">USMAN
    <animate attributeName="opacity" values="0;0;0.18;0;0.1;0;0;0;0.15;0;0" dur="4s" begin="1.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-3,0;3,0;0,0;0,0" dur="4s" begin="1.6s" repeatCount="indefinite"/>
  </text>

  <!-- Tagline -->
  <text x="400" y="158" text-anchor="middle"
    fill="#3D4654"
    font-family="'Courier New', Courier, monospace"
    font-size="10"
    letter-spacing="3"
    opacity="0">[ DATA SCIENCE · MACHINE LEARNING · AUTOMATION ]
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.4s" fill="freeze"/>
  </text>

  <!-- Bottom border -->
  <line x1="40" y1="170" x2="760" y2="170" stroke="#4A9EFF" stroke-width="0.8" opacity="0">
    <animate attributeName="opacity" from="0" to="0.5" dur="0.4s" begin="1.3s" fill="freeze"/>
  </line>

  <!-- Corner BL -->
  <text x="30" y="176" fill="#4A9EFF" font-family="monospace" font-size="13" opacity="0">╚
    <animate attributeName="opacity" from="0" to="0.8" dur="0.2s" begin="1.3s" fill="freeze"/>
  </text>
  <!-- Corner BR -->
  <text x="752" y="176" fill="#4A9EFF" font-family="monospace" font-size="13" opacity="0">╝
    <animate attributeName="opacity" from="0" to="0.8" dur="0.2s" begin="1.3s" fill="freeze"/>
  </text>

  <!-- Cursor blink after name renders -->
  <rect x="612" y="100" width="3" height="44" fill="#4A9EFF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="1s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
</svg>
